# 天气预报插件 whitefox.weather-forecast
# 福清双群；每天 06:00、22:20 播报（broadcast_time 逗号分隔）

[plugin]
enabled = true
config_version = "2.0.0"

[weather]
amap_key = "9cd26dd4ebb67e44dde1bba67d0392e7"

[groups]
target_groups = [
  "935350234 福清",
  "974533432 福清",
]

[schedule]
broadcast_enabled = true
broadcast_time = "06:00"

[broadcast]
max_length = 200
model_name = "replyer"

[tool]
enabled = true
default_days = 3
